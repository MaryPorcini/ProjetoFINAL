<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CINEpixel</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <header>
        <h1>CINEpixel</h1>
        <nav>
            <ul>
                <li><a href="/">Página Inicial</a></li>
                <li><a href="/tudo">Filmes</a></li>
                <li><a href="/generos">Gêneros</a></li>
                <li><a href="/personalizado">Filtro</a></li>
                <li><a href="#">Favoritos</a></li>
            </ul>
        </nav>
    </header>
    <style>

        .navbar {
            background-color: #222;
            padding: 15px 0;
            border-bottom: 3px solid #e50914;
            text-align: center;
        }
        .navbar .logo {
            color: #e50914;
            font-size: 3em;
            font-weight: bold;
            margin-bottom: 20px;
            display: block;
            text-decoration: none;
        }
        .navbar ul {
            list-style: none;
            padding: 0;
            margin: 0;
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
        }
        .navbar ul li {
            margin: 0 25px;
        }
        .navbar ul li a {
            color: white;
            text-decoration: none;
            font-size: 1.5em;
            font-weight: bold;
            transition: color 0.3s ease;
        }
        .navbar ul li a:hover {
            color: #e50914;
        }

        
    body {
        background-color: var(--cor-fundo);
        color: var(--cor-secundaria);
        text-align: center;
        font-family: 'Montserrat', sans-serif;
        overflow-x: hidden;
    }

 
    header {
        background: linear-gradient(to right, #1c1c1c, #292929);
        padding: 30px 0;
        border-bottom: 4px solid var(--cor-principal);
        box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.5);
    }

    h1 {
        font-family: 'Bebas Neue', cursive;
        font-size: 3em;
        font-weight: bold;
        color: var(--cor-principal);
        letter-spacing: 2px;
        text-shadow: 2px 2px 5px rgba(0, 0, 0, 0.7);
    }

        .genero-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 15px; 
            margin-top: 30px;
            padding: 20px; 
        }

.genero-btn {
    background-color: #1c1c1c; 
    border: none;
    /* --- ALTERAÇÕES AQUI --- */
    padding: 30px 48px; /* Aumenta o espaçamento interno */
    border-radius: 12px; 
    cursor: pointer;
    transition: background 0.3s; 
    color: white;
    text-decoration: none; 
    font-weight: bold;
    font-size: 25px; /* Aumenta o tamanho da fonte */
    /* --- FIM DAS ALTERAÇÕES --- */
    box-shadow: 0 0 10px rgba(0,0,0,0.4); 
}

        .genero-btn:hover {
            background-color: #e50914; 
            color: white;
        }
        
    </style>
</head>
<body>
    <h1>Escolha um Gênero</h1>

    <div class="genero-container">
        {% for genero in generos %}
            <a class="genero-btn" href="{{ url_for('filmes_do_genero', nome=genero) }}">
                {{ genero }}
            </a>
        {% endfor %}
    </div>
</body>
</html>
