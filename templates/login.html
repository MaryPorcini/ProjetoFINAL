<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    
</head>
<body class="auth-body">
    <div class="logo-container">
        <h1>CINEpixel</h1>
    </div>

    <div class="auth-wrapper">

        <div class="auth-container">
            <h1>Login</h1>
            <form action="/login" method="post">
                <div class="form-group">
                    <label for="login-email">Email</label>
                    <input type="email" id="login-email" name="email" required>
                </div>
                <div class="form-group">
                    <label for="login-senha">Senha</label>
                    <input type="password" id="login-senha" name="senha" required>
                </div>
                <button type="submit">Entrar</button>
            </form>
        </div>

        <div class="auth-container">
            <h1>Cadastro</h1>
            <form action="/cadastro" method="post">
                <div class="form-group">
                    <label for="cadastro-nome">Nome</label>
                    <input type="text" id="cadastro-nome" name="nome" required>
                </div>
                <div class="form-group">
                    <label for="cadastro-email">Email</label>
                    <input type="email" id="cadastro-email" name="email" required>
                </div>
                <div class="form-group">
                    <label for="cadastro-senha">Senha</label>
                    <input type="password" id="cadastro-senha" name="senha" required>
                </div>
                <div class="form-group">
                    <label for="cadastro-confirma-senha">Confirmar Senha</label>
                    <input type="password" id="cadastro-confirma-senha" name="confirma-senha" required>
                </div>
                <button type="submit">Cadastrar</button>
            </form>
        </div>

    </div>

</body>
</html>
